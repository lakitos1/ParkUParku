<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Park u parku – Jelovnik</title>
<meta name="description" content="Jelovnik i cene – Restoran Park u parku">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f6;--ink:#111;--green:#1d4a37;--mute:#444}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--ink);font:600 15px/1.4 Poppins,"Segoe UI",Arial,sans-serif}
header{text-align:center;padding:44px 20px 20px}
header h1{margin:0;font-size:2.4rem;font-weight:800;color:var(--green)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid #ddd;overflow-x:auto;white-space:nowrap;padding:10px 12px;text-align:center}
nav a{display:inline-block;margin:0 9px;color:var(--green);text-decoration:none;font-size:.85rem;font-weight:700}
nav a:hover,nav a:focus-visible{text-decoration:underline}
main{max-width:820px;margin:0 auto;padding:0 22px 30px}
section{margin-top:44px}
h2{margin:0;font-size:1.9rem;font-weight:800;text-transform:uppercase;padding-bottom:6px;border-bottom:5px solid var(--ink);line-height:1.2}
h3{margin:18px 0 0;font-size:1rem;font-weight:800;text-transform:uppercase}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:baseline;gap:12px;padding:11px 0}
li .n{flex:1}
li .d{display:block;font-size:.72rem;font-weight:600;color:var(--mute)}
li .p{font-weight:700;white-space:nowrap}
li .p.q{font-weight:500;font-size:.78rem;color:var(--mute)}
li.g .n{color:var(--green)}
.ic{filter:grayscale(1);font-size:.9em;margin-left:4px}
.cols{display:grid;grid-template-columns:1fr 1fr;column-gap:0}
.cols ul:first-child{padding-right:22px;border-right:4px solid var(--ink)}
.cols ul:last-child{padding-left:22px}
@media(max-width:640px){.cols{grid-template-columns:1fr}.cols ul:first-child{padding-right:0;border:0}.cols ul:last-child{padding-left:0}}
footer{text-align:center;padding:10px 20px 36px;color:var(--mute);font-size:.8rem}
.logo{display:block;margin:10px auto 14px;width:96px;height:auto}
</style>
</head>
<body>
<header><h1>Park u parku</h1></header>
<nav id="nav"></nav>
<main id="menu"></main>
<footer>
<img src="logo.svg" alt="Restoran Park" class="logo" onerror="this.remove()">
Cene su izražene u dinarima (RSD). &nbsp;🐟 posno &nbsp;❄ zimske salate
</footer>

<script>
// ["Naziv", cena, "opis (opciono)"]. Cena null = "po upitu". Zeleno istaknuta jela su u skupu GREEN.
const GREEN = new Set(["Park doručak","Kosjerićki doručak","Francuske prženice","Park pizza","Park ćevapi","Park mešano meso","Park batak","Karađorđeva šnicla mala","Karađorđeva šnicla velika","Dnevno kuvano jelo","Cezar","Palačinke pistać malina"]);
const MENU = [
 {id:"dorucak", t:"Doručak", items:[
  ["Park doručak",700,"lepinja, kajmak, pršuta, jaja"],
  ["Kosjerićki doručak",650,"proja, slanina, jaja, paradajz, krastavac, pomfrit"],
  ["Francuske prženice",700],["Prženice",550],["Uštipci",550],["Komplet lepinja",450],["Kačamak",420],
  ["Omlet šunka",470],["Omlet sir-spanać",470],["Omlet slanina",490],["Omlet dimljeni sir",520],["Omlet šampinjoni",490],
  ["Viršle i jaja",550],["Jaja na oko",350],["Jaja sa slaninom",490],["Jaja sa šunkom",470],
  ["Slane palačinke",600],["Pohovane palačinke",800],["Posne bruskete 🐟",800]],
  extra:[["Jogurt",100],["Kiselo mleko",130]]},
 {id:"tortilje", t:"Tortilje", items:[["Tortilja šunka",350],["Tortilja čajna",400],["Tortilja kulen",400],["Tortilja pršuta",470],["Tortilja tunjevina 🐟",470]]},
 {id:"pizza", t:"Pizza", items:[["Park pizza",1300],["Kaprićoza",900],["Posna pizza 🐟",900],["Mini pizza (kaprićoza, posna)",320]], extra:[["Goveđa salata",150]]},
 {id:"pasta", t:"Pasta", items:[["Bolognese",780],["Carbonara",820],["Rižoto sa piletinom i pečurkama",850]]},
 {id:"rostilj", t:"Jela sa roštilja", split:12, items:[
  ["Svinjski vrat",900],["Dimljena vešalica",1200],["Bela vešalica",980],["Ćevapi",930],
  ["Park ćevapi",1230,"ćevapi u kajmaku i ajvaru"],["Pljeskavica",930],["Punjena pljeskavica",1150],["Gurmanska pljeskavica",1200],
  ["Punjena vešalica",1380],["Mozaik piletina",1200],["Mešano meso",2100],["Park mešano meso",4900],
  ["Pileće belo",880],["Pileće belo sa kačkavaljem",950],["Batak",2200],["Punjeni batak",2700],["Park batak",1100],
  ["Džigerica pileća",700],["Kobasice sa sirom",1100],["Domaće kobasice",980],["Svinjski ražnjići",850]],
  extra:[["Kajmak",150]]},
 {id:"porudzbina", t:"Jela po porudžbini", items:[
  ["Natur šnicla",970],["Bečka šnicla",950],["Karađorđeva šnicla mala",960],["Karađorđeva šnicla velika",1320],
  ["Pileći štapići sa susamom",990],["Krilca",900],["Dinstana teletina",null]]},
 {id:"corba", t:"Čorbe", items:[["Čorba teleća",390],["Čorba riblja 🐟",310],["Domaća supa",320]]},
 {id:"kuvana", t:"Kuvana jela", items:[["Dnevno kuvano jelo",null],["Pasulj sa rebrima",450],["Prebranac",500],["Posni pasulj 🐟",350],["Ribić",790],["Gulaš",690]]},
 {id:"prilozi", t:"Prilozi i hleb", items:[["Pomfrit",340],["Grilovano povrće",450],["Pekarski krompir",340],["Lepinje",120],["Tortilje",110],["Štapići sa belim lukom",180]]},
 {id:"riba", t:"Riba", items:[["Pastrmka na žaru",2200],["Fileti pastrmke",null],["Fileti soma",1850],["Dimljeni šaran",null],["Losos",null]]},
 {id:"salate", t:"Salate", items:[
  ["Cezar",880],["Krompir salata",370],["Moravska",470],["Vitaminska",370],["Šopska",390],["Grčka",450],["Srpska",390],
  ["Pečena paprika ❄",390],["Mešana salata",360],["Paradajz sa sirom",390],["Kupus svež",350],["Presovani kupus ❄",450],
  ["Kiseli kupus ❄",390],["Cvekla ❄",350],["Paprika u pavlaci",350],["Ljuta sveža",130],["Ljuta pečena",150]]},
 {id:"dezert", t:"Dezert", items:[
  ["Palačinke krem plazma",380],["Palačinke džem",350],["Palačinke med orasi",390],["Palačinke pistać malina",900],
  ["Tufahije",560],["Baklave 🐟",380],["Žito sa šlagom 🐟",380],["Lava kolač",900],["Kolač sa makom",900],
  ["Pita sa jabukama 🐟",900],["Pita sa višnjama 🐟",900]],
  extra:[["Banana",70],["Malina",110],["Višnja",110]]},
 {id:"sladoled", t:"Sladoled", items:[["Kugla sladoleda",160],["Vruće maline sa sladoledom",560],["Voćna salata 🐟",450],["Banana split",470],["Jagoda kup",null]]}
];

const mark = s => s.replace(/🐟|❄/g, m => `<span class="ic">${m}</span>`);
const row = ([n,p,d]) =>
  `<li class="${GREEN.has(n)?"g":""}"><span class="n">${mark(n)}${d?`<span class="d">${d}</span>`:""}</span>` +
  (p==null ? `<span class="p q">cena na upit</span>` : `<span class="p">${p.toFixed(2)}</span>`) + `</li>`;
const list = a => `<ul>${a.map(row).join("")}</ul>`;

document.getElementById("nav").innerHTML = MENU.map(s=>`<a href="#${s.id}">${s.t}</a>`).join("");
document.getElementById("menu").innerHTML = MENU.map(s =>
  `<section id="${s.id}"><h2>${s.t}</h2>` +
  (s.split ? `<div class="cols">${list(s.items.slice(0,s.split))}${list(s.items.slice(s.split))}</div>` : list(s.items)) +
  (s.extra ? `<h3>Dodatak:</h3>${list(s.extra)}` : "") + `</section>`
).join("");
</script>
</body>
</html>
